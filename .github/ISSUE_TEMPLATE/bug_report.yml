name: 🐞 Bug report
description: Something in the app doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! A few details help a lot. A screenshot or a short screen recording is the fastest way to show the problem.
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Android phone / tablet
        - Windows
        - Mac (Apple Silicon)
        - Mac (Intel)
        - Web browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the About screen, or the release you downloaded (e.g. v1.2.0)
      placeholder: v1.2.0
    validations:
      required: true
  - type: dropdown
    id: look
    attributes:
      label: Look
      options: [Normal, Animated, Coastal Sunset, Showroom, Trading Floor, Not sure]
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead
      placeholder: |
        1. Opened the race line editor
        2. Moved a point and tapped Done
        3. The line jumped back to its old shape
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot, recording or track file
      description: Drag files here. If it happens on one track only, attach its .tgtrack file.
