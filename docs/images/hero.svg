<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#0c1a2b"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="300" rx="20" fill="url(#bg)"/>
  <rect x="20" y="20" width="960" height="260" rx="14" fill="url(#grid)" opacity="0.55"/>
  <!-- safety fence + race line -->
  <rect x="640" y="62" width="300" height="176" rx="6" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="9 7" opacity="0.85"/>
  <path d="M672 205 C 660 150, 700 95, 760 95 S 860 88, 900 120 S 905 200, 850 210 S 720 222, 672 205 Z" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
  <g font-size="13" font-weight="700" fill="#e0f2fe">
    <rect x="662" y="190" width="22" height="20" rx="4" fill="#0f2740" stroke="#38bdf8"/><text x="673" y="205" text-anchor="middle">1</text>
    <rect x="749" y="83" width="22" height="20" rx="4" fill="#0f2740" stroke="#38bdf8"/><text x="760" y="98" text-anchor="middle">2</text>
    <rect x="889" y="108" width="22" height="20" rx="4" fill="#0f2740" stroke="#38bdf8"/><text x="900" y="123" text-anchor="middle">3</text>
    <rect x="839" y="198" width="22" height="20" rx="4" fill="#0f2740" stroke="#38bdf8"/><text x="850" y="213" text-anchor="middle">4</text>
  </g>
  <!-- logo + title -->
  <rect x="60" y="72" width="64" height="64" rx="14" fill="url(#tg)"/>
  <text x="92" y="114" text-anchor="middle" fill="#fff" font-size="28" font-weight="800" font-family="Menlo,Consolas,monospace">TG</text>
  <text x="142" y="118" fill="#f8fafc" font-size="44" font-weight="800" letter-spacing="1">The Training Grounds</text>
  <text x="62" y="176" fill="#7dd3fc" font-size="23">FPV drone racing track designer</text>
  <text x="62" y="212" fill="#94a3b8" font-size="17">Plan gates · draw the race line · fly it in 3D · share the layout</text>
  <text x="62" y="248" fill="#64748b" font-size="15">Android · Windows · macOS · Web</text>
</svg>
