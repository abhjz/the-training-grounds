<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Drone Racing Gate Outer Arch -->
  <path d="M 120 400 L 120 220 A 136 136 0 0 1 392 220 L 392 400" 
        fill="none" stroke="#f59e0b" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Gate Inner Neon Glow Strip -->
  <path d="M 148 400 L 148 230 A 108 108 0 0 1 364 230 L 364 400" 
        fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>

  <!-- Gate Base Ground Stands -->
  <rect x="96" y="396" width="48" height="18" rx="6" fill="#f59e0b"/>
  <rect x="368" y="396" width="48" height="18" rx="6" fill="#f59e0b"/>

  <!-- Center Racing Drone Quadcopter Silhouette -->
  <!-- Diagonal Arms -->
  <line x1="200" y1="210" x2="312" y2="290" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <line x1="312" y1="210" x2="200" y2="290" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>

  <!-- 4 Motors / Rotor Discs -->
  <circle cx="196" cy="206" r="28" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4"/>
  <circle cx="316" cy="206" r="28" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4"/>
  <circle cx="196" cy="294" r="28" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 4"/>
  <circle cx="316" cy="294" r="28" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Center Pod Frame & FPV Camera Lens -->
  <rect x="236" y="230" width="40" height="40" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="256" cy="246" r="8" fill="#ef4444"/>
  <circle cx="256" cy="250" r="14" fill="none" stroke="#f87171" stroke-width="2"/>

  <!-- High-speed flight trajectory trail -->
  <path d="M 160 360 Q 256 310 352 360" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="10 8"/>
</svg>
